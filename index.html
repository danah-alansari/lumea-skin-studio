<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumea Skin Studio</title>
<meta name="description" content="AI-assisted skin analysis, dermatologist-reviewed recommendations, and a personalized skincare routine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
</head>
<body>
<!-- ============ APP SHELL ============ -->
<a class="skip-link" href="#view">Skip to content</a>

<header class="topbar" id="topbar" hidden>
  <div class="topbar__inner">
    <a class="brand" href="#/" aria-label="Lumea home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26"><circle cx="16" cy="16" r="12.5" fill="none" stroke="currentColor" stroke-width="1"/><path d="M16 4.5c5 3.4 7.6 7.3 7.6 11.5S21 24.2 16 27.5c-5-3.3-7.6-7.3-7.6-11.5S11 7.9 16 4.5Z" fill="none" stroke="currentColor" stroke-width="1" opacity=".65"/></svg>
      </span>
      <span class="brand__word">LUMEA</span>
    </a>

    <nav class="mainnav" id="mainnav" aria-label="Primary"></nav>

    <div class="topbar__actions">
      <a class="iconbtn" href="#/basket" aria-label="Basket">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 7h16l-1.3 12.2a2 2 0 0 1-2 1.8H7.3a2 2 0 0 1-2-1.8L4 7Z"/><path d="M9 7V5.6A3 3 0 0 1 12 2.6a3 3 0 0 1 3 3V7"/></svg>
        <span class="badge" id="cartCount" hidden>0</span>
      </a>
      <div class="accountmenu" id="accountMenu"></div>
    </div>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<nav class="bottomnav" id="bottomnav" aria-label="Primary mobile" hidden></nav>

<div class="toaster" id="toaster" role="status" aria-live="polite"></div>
<div class="modalroot" id="modalRoot" hidden></div>
<div class="curtain" id="curtain" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
